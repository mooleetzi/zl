<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>七夕 · lcl ❤ 小🌰（秋儿）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    .content {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; text-align: center;
      pointer-events: none;
    }
    .content > * { pointer-events: auto; }
    .top-line {
      position: absolute; top: 8%;
      font-size: 14px; letter-spacing: 4px;
      color: rgba(255,255,255,0.6);
    }
    .title {
      font-size: clamp(64px, 24vw, 96px);
      font-weight: 700;
      letter-spacing: 12px;
      text-shadow:
        0 0 20px rgba(255,200,220,0.8),
        0 0 60px rgba(200,100,255,0.4);
      margin-bottom: 12px;
      animation: fadeInDown 1.2s ease-out both;
    }
    .subtitle {
      font-size: clamp(15px, 4.6vw, 20px);
      letter-spacing: 4px;
      color: rgba(255,220,240,0.95);
      margin-bottom: 26px;
      text-shadow: 0 0 12px rgba(255,150,200,0.5);
      animation: fadeInUp 1.4s ease-out both;
      padding: 0 16px;
    }
    .names {
      font-size: clamp(21px, 6.5vw, 30px);
      letter-spacing: 5px;
      margin-bottom: 56px;
      color: #ffd1dc;
      text-shadow: 0 0 16px rgba(255,150,200,0.6);
      animation: fadeInUp 1.6s ease-out both;
      white-space: nowrap;
    }
    .btn-enter {
      padding: 17px 46px;
      border: 1px solid rgba(255,200,220,0.5);
      border-radius: 40px;
      background: rgba(255,200,220,0.08);
      color: #fff; font-size: 15px;
      letter-spacing: 2px; cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all .45s ease;
      text-decoration: none; display: inline-block;
      animation: fadeInUp 1.8s ease-out both;
    }
    .btn-enter:hover {
      background: rgba(255,200,220,0.25);
      box-shadow: 0 0 40px rgba(255,150,200,0.45);
      transform: translateY(-3px);
      border-color: rgba(255,200,220,0.8);
    }
    .bottom-line {
      position: absolute; bottom: 6%;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 2px;
      animation: fadeIn 2s ease-out both;
    }
    /* 喜鹊飞过 */
    .magpie {
      position: absolute; top: 22%; left: -120px;
      width: 80px; height: 40px; z-index: 3;
      opacity: 0.7;
      animation: flyAcross 14s linear infinite;
    }
    .magpie svg { width: 100%; height: 100%; filter: drop-shadow(0 0 4px rgba(200,220,255,0.5)); }
    @keyframes flyAcross {
      0% { left: -120px; transform: translateY(0) scaleX(1); }
      45% { transform: translateY(10px) scaleX(1); }
      50% { left: 110%; transform: translateY(0) scaleX(-1); }
      95% { transform: translateY(10px) scaleX(-1); }
      100% { left: -120px; transform: translateY(0) scaleX(1); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <div class="magpie">
    <svg viewBox="0 0 120 60" fill="none">
      <path d="M10 30 Q30 10 50 30 Q70 50 90 30 Q100 25 110 28" stroke="rgba(220,230,255,0.8)" stroke-width="2.5" fill="none"/>
      <path d="M50 30 Q55 18 58 12 Q52 18 50 30" fill="rgba(220,230,255,0.7)"/>
      <circle cx="92" cy="26" r="2.5" fill="rgba(255,200,100,0.9)"/>
    </svg>
  </div>

  <div class="content">
    <div class="top-line">农历七月初七 · 丙午年 · 2026</div>
    <div class="title">七夕</div>
    <div class="subtitle">星河万里，只为见你一面</div>
    <div class="names">lcl ❤ 小🌰（秋儿）</div>
    <a href="static/heart_dance/index.html" class="btn-enter">轻触开启 · 我们的七夕</a>
    <div class="bottom-line">2026.08.19 · 牛郎织女相会之日</div>
  </div>

  <script>
    (function(){
      const c = document.getElementById('starCanvas');
      const ctx = c.getContext('2d');
      let w, h;
      function resize(){ w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);

      // 普通星星
      const stars = [];
      for(let i=0;i<350;i++){
        stars.push({
          x: Math.random()*w, y: Math.random()*h,
          r: Math.random()*1.4 + .15,
          alpha: Math.random(),
          speed: Math.random()*0.008 + 0.002
        });
      }

      // 银河星带（椭圆分布）
      const milky = [];
      for(let i=0;i<500;i++){
        const t = Math.random()*Math.PI*2;
        const d = Math.random()*Math.min(w,h)*0.38 + Math.min(w,h)*0.08;
        milky.push({
          x: Math.cos(t)*d,
          y: Math.sin(t)*d*0.28,
          r: Math.random()*0.7 + 0.1,
          alpha: Math.random()*0.5 + 0.08,
          speed: Math.random()*0.003 + 0.001
        });
      }

      // 流星
      let meteors = [];
      function spawnMeteor(){
        if(Math.random()>0.25) return;
        meteors.push({
          x: Math.random()*w + w*0.15,
          y: Math.random()*h*0.25,
          len: Math.random()*90 + 60,
          speed: Math.random()*7 + 4,
          angle: -Math.PI/4 + (Math.random()-0.5)*0.15,
          width: Math.random()*1.5 + 1
        });
      }
      setInterval(spawnMeteor, 1800);

      function draw(){
        ctx.clearRect(0,0,w,h);

        // 普通星星
        stars.forEach(s=>{
          s.alpha += s.speed;
          if(s.alpha>1 || s.alpha<0) s.speed *= -1;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255,255,255,${Math.max(0.05, Math.abs(s.alpha))})`;
          ctx.fill();
        });

        // 银河
        ctx.save();
        ctx.translate(w/2, h/2);
        ctx.rotate(0.12);
        milky.forEach(m=>{
          m.alpha += m.speed;
          if(m.alpha>0.6 || m.alpha<0.05) m.speed *= -1;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(200,210,255,${m.alpha})`;
          ctx.fill();
        });
        ctx.restore();

        // 流星
        meteors.forEach((m,i)=>{
          m.x -= Math.cos(m.angle)*m.speed;
          m.y -= Math.sin(m.angle)*m.speed;
          const grad = ctx.createLinearGradient(m.x, m.y, m.x + m.len*Math.cos(m.angle), m.y + m.len*Math.sin(m.angle));
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(1, 'rgba(255,255,255,0.85)');
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(m.x + m.len*Math.cos(m.angle), m.y + m.len*Math.sin(m.angle));
          ctx.strokeStyle = grad;
          ctx.lineWidth = m.width;
          ctx.stroke();
          if(m.x < -300 || m.y > h + 300 || m.x > w + 300) meteors.splice(i,1);
        });

        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
