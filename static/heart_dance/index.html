<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link
      rel="shortcut icon"
      href="https://cdn.jsdelivr.net/gh/fromann/CDN@main/img/logo.ico"
    />
    <title>小🌰（秋儿）&#10084;&#65039;</title>
    <script src="https://cdn.jsdelivr.net/gh/zyoushuo/Blog/hexo/js/mouse_slide.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/zyoushuo/Blog/hexo/js/clicklove.js"></script>
    <style type="text/css">
      html,
      body {
        height: 100%;
        height: 100dvh;
        padding: 0;
        margin: 0;
        background: url("./image/bg.jpg") no-repeat center center / cover;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        padding: 6vh 0;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .namebox {
        color: #fff;
        position: relative;
        text-align: center;
        z-index: 5;
      }
      .namebox h1 {
        margin: 0 auto;
        text-shadow: 0 0 20px rgba(255,48,197,.7), 0 0 45px rgba(255,48,197,.35);
        font-size: clamp(26px, 8vw, 40px);
        white-space: nowrap;
      }
      /* 七夕氛围遮罩 */
      body::before {
        content: '';
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at top, rgba(40,10,70,.45), transparent 70%), radial-gradient(ellipse at bottom, rgba(70,10,40,.35), transparent 70%);
        z-index: 1; pointer-events: none;
      }
      .qixi-text {
        position: relative;
        color: rgba(255,220,240,.95);
        font-size: clamp(13px, 3.8vw, 16px);
        letter-spacing: 2px;
        text-align: center;
        z-index: 5;
        text-shadow: 0 0 10px rgba(255,100,180,.5);
        line-height: 1.9;
        max-width: 90vw;
        pointer-events: none;
      }
      /* 回忆相册（三图轮播） */
      .album {
        position: relative;
        width: clamp(120px, 40vw, 160px);
        aspect-ratio: 150 / 198;
        z-index: 5;
        cursor: pointer;
      }
      .album-slide {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 3px rgba(255,150,200,.35);
        opacity: 0;
        transform: scale(.82) translateY(12px) rotate(-7deg);
        transition: all .7s cubic-bezier(.4,0,.2,1);
        z-index: 1;
        background: rgba(255,150,200,.15);
      }
      .album-slide img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
      }
      .album-slide.active {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0);
        z-index: 3;
      }
      .album-slide.prev {
        opacity: .45;
        transform: scale(.86) translateY(-8px) rotate(7deg);
        z-index: 2;
      }
      .album-dots {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 6;
      }
      .album-dots span {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,.35);
        transition: all .4s;
        cursor: pointer;
      }
      .album-dots span.on {
        background: rgba(255,150,200,.95);
        box-shadow: 0 0 8px rgba(255,48,197,.6);
        transform: scale(1.25);
      }
      .next-btn {
        position: relative;
        padding: 13px 40px;
        border: 1px solid rgba(255,150,200,.5);
        border-radius: 30px;
        background: rgba(255,48,197,.15);
        color: #fff;
        font-size: 14px;
        letter-spacing: 2px;
        text-decoration: none;
        z-index: 5;
        backdrop-filter: blur(5px);
        transition: all .35s ease;
        cursor: pointer;
      }
      .next-btn:active {
        background: rgba(255,48,197,.4);
        transform: scale(.95);
      }
      .next-btn:hover {
        background: rgba(255,48,197,.35);
        box-shadow: 0 0 24px rgba(255,48,197,.45);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <canvas id="pinkboard"></canvas>
    <script>
      var settings = {
        particles: {
          length: 500, // maximum amount of particles
          duration: 2, // particle duration in sec
          velocity: 100, // particle velocity in pixels/sec
          effect: -0.75, // play with this for a nice effect
          size: 30, // particle size in pixels
        },
      };
      (function () {
        var b = 0;
        var c = ["ms", "moz", "webkit", "o"];
        for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
          window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
          window.cancelAnimationFrame =
            window[c[a] + "CancelAnimationFrame"] ||
            window[c[a] + "CancelRequestAnimationFrame"];
        }
        if (!window.requestAnimationFrame) {
          window.requestAnimationFrame = function (h, e) {
            var d = new Date().getTime();
            var f = Math.max(0, 16 - (d - b));
            var g = window.setTimeout(function () {
              h(d + f);
            }, f);
            b = d + f;
            return g;
          };
        }
        if (!window.cancelAnimationFrame) {
          window.cancelAnimationFrame = function (d) {
            clearTimeout(d);
          };
        }
      })();
      var Point = (function () {
        function Point(x, y) {
          this.x = typeof x !== "undefined" ? x : 0;
          this.y = typeof y !== "undefined" ? y : 0;
        }
        Point.prototype.clone = function () {
          return new Point(this.x, this.y);
        };
        Point.prototype.length = function (length) {
          if (typeof length == "undefined")
            return Math.sqrt(this.x * this.x + this.y * this.y);
          this.normalize();
          this.x *= length;
          this.y *= length;
          return this;
        };

        Point.prototype.normalize = function () {
          var length = this.length();
          this.x /= length;
          this.y /= length;
          return this;
        };
        return Point;
      })();

      var Particle = (function () {
        function Particle() {
          this.position = new Point();
          this.velocity = new Point();
          this.acceleration = new Point();
          this.age = 0;
        }
        Particle.prototype.initialize = function (x, y, dx, dy) {
          this.position.x = x;
          this.position.y = y;
          this.velocity.x = dx;
          this.velocity.y = dy;
          this.acceleration.x = dx * settings.particles.effect;
          this.acceleration.y = dy * settings.particles.effect;
          this.age = 0;
        };
        Particle.prototype.update = function (deltaTime) {
          this.position.x += this.velocity.x * deltaTime;
          this.position.y += this.velocity.y * deltaTime;
          this.velocity.x += this.acceleration.x * deltaTime;
          this.velocity.y += this.acceleration.y * deltaTime;
          this.age += deltaTime;
        };

        Particle.prototype.draw = function (context, image) {
          function ease(t) {
            return --t * t * t + 1;
          }
          var size = image.width * ease(this.age / settings.particles.duration);
          context.globalAlpha = 1 - this.age / settings.particles.duration;
          context.drawImage(
            image,
            this.position.x - size / 2,
            this.position.y - size / 2,
            size,
            size
          );
        };
        return Particle;
      })();
      /*

  * ParticlePool class

  */
      var ParticlePool = (function () {
        var particles,
          firstActive = 0,
          firstFree = 0,
          duration = settings.particles.duration;
        function ParticlePool(length) {
          // create and populate particle pool
          particles = new Array(length);
          for (var i = 0; i < particles.length; i++)
            particles[i] = new Particle();
        }
        ParticlePool.prototype.add = function (x, y, dx, dy) {
          particles[firstFree].initialize(x, y, dx, dy);
          // handle circular queue
          firstFree++;
          if (firstFree == particles.length) firstFree = 0;
          if (firstActive == firstFree) firstActive++;
          if (firstActive == particles.length) firstActive = 0;
        };
        ParticlePool.prototype.update = function (deltaTime) {
          var i;
          // update active particles
          if (firstActive < firstFree) {
            for (i = firstActive; i < firstFree; i++)
              particles[i].update(deltaTime);
          }
          if (firstFree < firstActive) {
            for (i = firstActive; i < particles.length; i++)
              particles[i].update(deltaTime);
            for (i = 0; i < firstFree; i++) particles[i].update(deltaTime);
          }
          // remove inactive particles
          while (
            particles[firstActive].age >= duration &&
            firstActive != firstFree
          ) {
            firstActive++;
            if (firstActive == particles.length) firstActive = 0;
          }
        };
        ParticlePool.prototype.draw = function (context, image) {
          // draw active particles
          if (firstActive < firstFree) {
            for (i = firstActive; i < firstFree; i++)
              particles[i].draw(context, image);
          }
          if (firstFree < firstActive) {
            for (i = firstActive; i < particles.length; i++)
              particles[i].draw(context, image);
            for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
          }
        };
        return ParticlePool;
      })();
      /*

  * Putting it all together

  */
      (function (canvas) {
        var context = canvas.getContext("2d"),
          particles = new ParticlePool(settings.particles.length),
          particleRate =
            settings.particles.length / settings.particles.duration, // particles/sec
          time;
        // get point on heart with -PI <= t <= PI
        function pointOnHeart(t) {
          return new Point(
            160 * Math.pow(Math.sin(t), 3),
            130 * Math.cos(t) -
              50 * Math.cos(2 * t) -
              20 * Math.cos(3 * t) -
              10 * Math.cos(4 * t) +
              25
          );
        }

        // creating the particle image using a dummy canvas

        var image = (function () {
          var canvas = document.createElement("canvas"),
            context = canvas.getContext("2d");
          canvas.width = settings.particles.size;
          canvas.height = settings.particles.size;
          // helper function to create the path
          function to(t) {
            var point = pointOnHeart(t);
            point.x =
              settings.particles.size / 2 +
              (point.x * settings.particles.size) / 350;
            point.y =
              settings.particles.size / 2 -
              (point.y * settings.particles.size) / 350;
            return point;
          }
          // create the path
          context.beginPath();
          var t = -Math.PI;
          var point = to(t);
          context.moveTo(point.x, point.y);
          while (t < Math.PI) {
            t += 0.01; // baby steps!
            point = to(t);
            context.lineTo(point.x, point.y);
          }
          context.closePath();
          // create the fill
          context.fillStyle = "#ff30c5";
          // context.fillStyle = '#ea80b0';
          context.fill();
          // create the image
          var image = new Image();
          image.src = canvas.toDataURL();
          return image;
        })();
        // render that thing!
        function render() {
          // next animation frame
          requestAnimationFrame(render);
          // update time
          var newTime = new Date().getTime() / 1000,
            deltaTime = newTime - (time || newTime);
          time = newTime;
          // clear canvas
          context.clearRect(0, 0, canvas.width, canvas.height);
          // create new particles
          var amount = particleRate * deltaTime;
          for (var i = 0; i < amount; i++) {
            var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
            var dir = pos.clone().length(settings.particles.velocity);
            particles.add(
              canvas.width / 2 + pos.x,
              canvas.height / 2 - pos.y,
              dir.x,
              -dir.y
            );
          }
          // update and draw particles
          particles.update(deltaTime);
          particles.draw(context, image);
        }
        // handle (re-)sizing of the canvas
        function onResize() {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
        }
        window.onresize = onResize;
        // delay rendering bootstrap
        setTimeout(function () {
          onResize();
          render();
        }, 10);
      })(document.getElementById("pinkboard"));
    </script>
    <div class="namebox">
      <h1>lcl&#10084;&#65039;zl</h1>
    </div>
    <div class="qixi-text">
      七月初七 · 星河为证<br>
      我把心动，藏进每一颗星星里
    </div>
    <div class="album" id="album">
      <div class="album-slide active"><img src="./image/photo1.jpg" alt="我们的回忆 1"></div>
      <div class="album-slide"><img src="./image/photo2.jpg" alt="我们的回忆 2"></div>
      <div class="album-slide"><img src="./image/photo3.jpg" alt="我们的回忆 3"></div>
      <div class="album-dots" id="albumDots"></div>
    </div>
    <a href="../love_tree/index.html" class="next-btn">💕 去看看我们的树 →</a>
    <script>
      (function(){
        var slides = Array.prototype.slice.call(document.querySelectorAll('.album-slide'));
        var dotsWrap = document.getElementById('albumDots');
        var album = document.getElementById('album');
        if(!slides.length || !album) return;
        var cur = 0;
        slides.forEach(function(s,i){
          var d = document.createElement('span');
          if(i===0) d.className = 'on';
          (function(idx){ d.addEventListener('click', function(e){ e.stopPropagation(); go(idx); }); })(i);
          dotsWrap.appendChild(d);
        });
        var dots = Array.prototype.slice.call(dotsWrap.children);
        function go(n){
          cur = (n + slides.length) % slides.length;
          slides.forEach(function(s,i){
            s.classList.remove('active','prev');
            if(i === cur) s.classList.add('active');
            else if(i === (cur - 1 + slides.length) % slides.length) s.classList.add('prev');
          });
          dots.forEach(function(d,i){ d.className = i === cur ? 'on' : ''; });
        }
        var timer = setInterval(function(){ go(cur + 1); }, 3500);
        album.addEventListener('click', function(){ go(cur + 1); });
      })();
    </script>
  </body>
